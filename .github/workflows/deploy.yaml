name: Deploy to GitHub Pages

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Clean
        run: flutter clean

      - name: Check Secret
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ GROQ_API_KEY is EMPTY"
          else
            echo "✅ GROQ_API_KEY is set, length=${#GROQ_API_KEY}"
          fi
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Build Web
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: flutter build web --release --base-href "/ketch4n_portfolio/" --dart-define=GROQ_API_KEY="$GROQ_API_KEY"

      - name: Check built file for key
        run: |
          if grep -q "gsk_" build/web/main.dart.js; then
            echo "❌ Key found in build output!"
          else
            echo "✅ No key in build output"
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
